# ============================================================================
# gui.cfg
# ============================================================================
# Konfiguration der Dear-PyGui-Oberfläche (sproject Editor)
# Alle GUI-spezifischen Werte sind hier zentral definiert.
#
# Dialog-Groessen mit _pct Suffix sind Prozentangaben relativ zu [base].
# Die Aufloesung erfolgt automatisch: width_pct = 40.6 bei base 1280 -> 520px.
# Aendert man [base] viewport_width/height, skalieren alle Dialoge mit.
# ============================================================================

# ── Basis-Viewport (Referenz fuer alle _pct Angaben) ───────────────────────
[base]
viewport_width  = 1280
viewport_height = 860

# ── Farb-Themes ─────────────────────────────────────────────────────────────
# Aktives Theme: Name einer .cfg-Datei in cfg/themes/ (ohne Endung)
# Verfuegbare Themes werden automatisch aus dem Verzeichnis PV_THEMES geladen.
[theme]
active = dark

# ── Sprache / Language ────────────────────────────────────────────────────
# Aktive Sprache: de | en
[language]
active = en

# ── Font ────────────────────────────────────────────────────────────────────
[font]
# Pfad zur TTF-Datei (leer = Dear-PyGui-Standardfont)
path = C:/Windows/Fonts/segoeui.ttf
size = 18

# Unicode-Glyph-Ranges (Hex-Paare: start, end)
# Default-Range wird immer geladen (ASCII + Basic Latin)
# Zusaetzliche Ranges fuer erweiterte Zeichen:
ranges =
    0x00C0, 0x00FF,
    0x2000, 0x206F,
    0x2190, 0x21FF,
    0x2500, 0x25FF,
    0x2600, 0x26FF

# Beschreibung der Ranges (nur Dokumentation):
#   0x00C0-0x00FF  Latin Supplement (ae, oe, ue, ...)
#   0x2000-0x206F  General Punctuation (Gedankenstrich, Ellipsis, ...)
#   0x2190-0x21FF  Arrows (Pfeile)
#   0x2500-0x25FF  Box Drawing + Geometric Shapes (Dreiecke, ...)
#   0x2600-0x26FF  Misc Symbols (Stern, Warnung, ...)

# ── Style ───────────────────────────────────────────────────────────────────
[style]
frame_rounding  = 4
window_rounding = 4
item_spacing_x  = 6
item_spacing_y  = 4

# ── Viewport ────────────────────────────────────────────────────────────────
[viewport]
title      = sproject Editor
# width/height kommen aus [base] viewport_width/viewport_height
min_width  = 900
min_height = 600

# ── Layout ──────────────────────────────────────────────────────────────────
# _pct Werte: Prozent relativ zu [base] viewport_width bzw. viewport_height
[layout]
sidebar_width_pct = 16.4

# ── Dialoge ─────────────────────────────────────────────────────────────────
# _pct Werte: Prozent relativ zu [base] viewport_width (Breite, pos_x)
#             bzw. viewport_height (Hoehe, pos_y)
[dialog.save]
width_pct  = 40.6
height_pct = 12.8
pos_x_pct  = 29.7
pos_y_pct  = 41.9

[dialog.export]
width_pct  = 32.8
height_pct = 27.9
pos_x_pct  = 33.6
pos_y_pct  = 30.2

[dialog.about]
width_pct  = 31.3
height_pct = 17.4
pos_x_pct  = 34.4
pos_y_pct  = 34.9

[dialog.file_browser]
width_pct      = 51.6
height_pct     = 58.1
pos_x_pct      = 21.9
pos_y_pct      = 14.0
list_height_pct = 39.5
# Button-Groessen bleiben absolute Pixel
button_height  = 38
button_width   = 160

[dialog.successor_add]
width_pct  = 25.0
height_pct = 15.1
pos_x_pct  = 35.2
pos_y_pct  = 34.9

[dialog.successor_add_empty]
width_pct  = 23.4
height_pct = 9.3
pos_x_pct  = 35.2
pos_y_pct  = 37.2

[dialog.successor_remove]
width_pct  = 23.4
pos_x_pct  = 35.2
pos_y_pct  = 34.9
# height wird dynamisch berechnet: min(base_height + n * row_height, max_height)
base_height = 80
row_height  = 26
max_height  = 400

[dialog.successor_remove_empty]
width_pct  = 21.9
height_pct = 9.3
pos_x_pct  = 35.2
pos_y_pct  = 37.2

[dialog.resource_picker]
width_pct  = 35.9
pos_x_pct  = 27.3
pos_y_pct  = 20.9
# height wird dynamisch: min(base_height + n * row_height, max_height)
base_height = 120
row_height  = 26
max_height  = 500

[dialog.resource_picker_empty]
width_pct  = 25.0
height_pct = 9.3
pos_x_pct  = 31.3
pos_y_pct  = 34.9

# ── Autocomplete-Popup (Export-Dialog) ──────────────────────────────────────
# Nicht viewport-abhaengig (haengt von Input-Feld-Position ab)
[autocomplete]
min_width       = 260
max_items       = 8
item_height     = 22
padding         = 14

# ── Task-Tabelle ────────────────────────────────────────────────────────────
# Spaltenbreiten: feste Pixel oder Stretch-Gewichte (unabhaengig von Viewport)
[task_table]
col_id_width         = 60
col_name_weight      = 0.28
col_duration_width   = 85
col_successor_weight = 0.20
col_succ_add_width   = 32
col_succ_rem_width   = 32
col_resource_weight  = 0.20
col_cost_width       = 75
col_actions_width    = 95

# Breiten innerhalb der Zellen
resource_picker_btn_width = 25
resource_input_offset     = -30
delete_btn_width          = 28
subtask_btn_width         = 40

# ── Stammdaten-Tabelle ─────────────────────────────────────────────────────
[stammdaten_table]
col_label_width   = 130
col_label2_width  = 120

# ── Ressourcen-Tabelle ──────────────────────────────────────────────────────
[resources_table]
col_id_width    = 100
col_type_width  = 90
col_color_width = 80

# ── Personen-Tabelle ───────────────────────────────────────────────────────
[persons_table]
col_id_width    = 90
col_rate_width  = 70

# ── Ruhezeiten-Tabelle ─────────────────────────────────────────────────────
[resting_times_table]
col_hours_width = 90
col_pause_width = 80

# ── Ergebnis-Tabelle ───────────────────────────────────────────────────────
[result_table]
col_id_width     = 60
col_faz_width    = 70
col_fez_width    = 70
col_saz_width    = 70
col_sez_width    = 70
col_puffer_width = 70
col_krit_width   = 45

# ── Nachfolger-Dialog (Tabelle) ────────────────────────────────────────────
[successor_dialog_table]
col_label_width = 90

# ── Farben (semantisch) ────────────────────────────────────────────────────
# Format: R, G, B (jeweils 0-255) oder R, G, B, A (mit Alpha-Transparenz)
[colors]
# Task-Tabelle: Zeilen-Highlights (R, G, B, A)
loop_row       = 254, 243, 199, 110
subtask_row    = 240, 240, 245, 90
critical_row   = 220, 80, 80, 80

# Statusbar (R, G, B)
status_text    = 150, 160, 170

# Toolbar-Separator (R, G, B)
toolbar_sep    = 100, 100, 110

# Sidebar (R, G, B)
sidebar_wizard       = 160, 160, 180
sidebar_inactive     = 180, 180, 200
sidebar_active       = 220, 220, 255
sidebar_examples     = 140, 140, 160

# Hinweistexte (R, G, B)
hint_text            = 140, 140, 150
empty_text           = 160, 160, 170
dialog_label         = 180, 180, 210
dialog_prompt        = 180, 180, 200
warning_text         = 220, 180, 60
path_label           = 180, 180, 200

# Ergebnis-Panel (R, G, B)
result_duration      = 100, 180, 255
result_critical_path = 220, 80, 80

# About-Dialog (R, G, B)
about_title          = 180, 210, 255

# Resource-Picker (R, G, B bzw. R, G, B, A)
picker_id            = 220, 220, 255
picker_name          = 200, 200, 200
picker_type          = 150, 150, 170
picker_dot_fallback  = 150, 150, 150, 200
