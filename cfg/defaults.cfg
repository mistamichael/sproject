# ============================================================================
# defaults.cfg
# ============================================================================
# Default-Werte für Projekt-Berechnungen
# Diese Werte werden verwendet, wenn keine spezifischen Angaben vorhanden sind
# ============================================================================

[Project]
# Standard-Projektstartdatum (falls nicht angegeben)
# Format: YYYY-MM-DD oder "today" für heutiges Datum
start_date = today

# (nicht verwendet – nur in config_loader.py definiert)
# timezone = Europe/Berlin
# currency = EUR
# timeformat = %Y-%m-%d

[Resource]
# Standard-Stundensatz in EUR
hourly_rate = 100.00

# (nicht verwendet – nur in config_loader.py definiert)
# name = Max Mustermann
# email = max@mustermann.com
# id = default_resource

[WorkingHours]
# Arbeitsstunden pro Tag
hours_per_day = 8

# Arbeitstage pro Woche
days_per_week = 5

# Arbeitswochentage (kommasepariert)
working_days = mon,tue,wed,thu,fri

# Standard-Arbeitszeiten
# Format: HH:MM-HH:MM
morning_shift = 09:00-12:00
afternoon_shift = 13:00-17:00

# Pause zwischen den Schichten (in Minuten)
lunch_break = 60

# [Holidays] – (nicht verwendet – nur in config_loader.py definiert)
# consider_holidays = true
# country = DE
# region = BY
# color = 87CEEB

[CPM]
# Wochenenden bei Datumsberechnung überspringen
skip_weekends = true

# Feiertage bei Datumsberechnung überspringen
# Wenn aktiviert, werden gesetzliche Feiertage aus der holidays-Bibliothek geladen
skip_holidays = true

# (nicht verwendet – nur in config_loader.py definiert)
# round_slack = false
# critical_tolerance = 0.001

[Duration]
# Konvertierungsfaktoren für Dauern
# 1 Woche = X Arbeitstage
week_to_days = 5

# 1 Tag = X Arbeitsstunden
day_to_hours = 8

# 1 Monat = X Arbeitstage (durchschnittlich)
month_to_days = 20

[Output]
# Standard-Ausgabeverzeichnis für Berechnungen
results_dir = results


[Costs]
# Standard-Overhead-Faktor (Multiplikator für Personalkosten)
overhead_factor = 1.5

# (nicht verwendet – nur in config_loader.py definiert)
# risk_buffer_percent = 10
# vat_percent = 19

[ResourceAutoColor]
# Automatische Farbzuweisung für Ressourcen ohne explizites color-Feld (Hex ohne #)
# Farbverlauf von color_start bis color_end, gleichmäßig über alle Ressourcen verteilt
color_start = 4472C4
color_end   = 8B7AB8

[de]
# Gemeinsame Spaltentitel für alle Export-Formate (txt, markdown, excel, json).
# Werden von den export-spezifischen [de]-Sektionen überschrieben.
id         = ID
name       = Name
dauer      = Dauer
faz        = FAZ
fez        = FEZ
saz        = SAZ
sez        = SEZ
gp         = GP
fp         = FP
krit       = Krit.

#
# ============================================================================
# Ende der Konfiguration
# ============================================================================
