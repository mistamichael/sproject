# ============================================================================
# defaults.cfg
# ============================================================================
# Default-Werte für Projekt-Berechnungen
# Diese Werte werden verwendet, wenn keine spezifischen Angaben vorhanden sind
# ============================================================================

[Project]
# Standard-Projektstartdatum (falls nicht angegeben)
# Format: YYYY-MM-DD oder "today" für heutiges Datum
start_date = today

# Standard-Zeitzone
timezone = Europe/Berlin

# Standard-Währung
currency = EUR

# Zeitformat für Ausgaben
timeformat = %Y-%m-%d

[Resource]
# Standard-Ressource (wenn keine Mitarbeiter definiert sind)
name = Max Mustermann
email = max@mustermann.com
id = default_resource

# Standard-Stundensatz in EUR
hourly_rate = 100.00

[WorkingHours]
# Arbeitsstunden pro Tag
hours_per_day = 8

# Arbeitstage pro Woche
days_per_week = 5

# Arbeitswochentage (kommasepariert)
working_days = mon,tue,wed,thu,fri

# Standard-Arbeitszeiten
# Format: HH:MM-HH:MM
morning_shift = 09:00-12:00
afternoon_shift = 13:00-17:00

# Pause zwischen den Schichten (in Minuten)
lunch_break = 60

[Holidays]
# Berücksichtigung von Feiertagen
consider_holidays = true

# Standard-Land für Feiertage
country = DE
region = BY

[CPM]
# Runden der Pufferzeiten auf ganze Tage
round_slack = false

# Toleranz für Floating-Point-Vergleiche bei Puffer=0
critical_tolerance = 0.001

# Wochenenden bei Datumsberechnung überspringen
skip_weekends = true

# Feiertage bei Datumsberechnung überspringen
skip_holidays = false

[Duration]
# Konvertierungsfaktoren für Dauern
# 1 Woche = X Arbeitstage
week_to_days = 5

# 1 Tag = X Arbeitsstunden
day_to_hours = 8

# 1 Monat = X Arbeitstage (durchschnittlich)
month_to_days = 20

[Output]
# Standard-Ausgabeverzeichnis für Berechnungen
results_dir = results

# Standard-Ausgabeverzeichnis für Graphen
graphs_dir = graphs

# Ausgabeformat für JSON (Einrückung)
json_indent = 2

# Datumsangaben in Ausgabe einschließen
include_dates = true

# Detaillierte Informationen in Ausgabe
verbose_output = false

[Costs]
# Standard-Overhead-Faktor (Multiplikator für Personalkosten)
overhead_factor = 1.5

# Standard-Risikopuffer (in Prozent)
risk_buffer_percent = 10

# Mehrwertsteuer (in Prozent)
vat_percent = 19

# ============================================================================
# Folgende Sektionen sind aktuell nicht implementiert und auskommentiert
# ============================================================================

# [Quality]
# # Standard-Qualitätsstufe (1-5)
# # 1 = Minimal, 3 = Standard, 5 = Premium
# quality_level = 3
#
# # Zusätzliche Testzeit (in Prozent der Entwicklungszeit)
# test_time_percent = 20
#
# # Code-Review-Zeit (in Prozent der Entwicklungszeit)
# review_time_percent = 10

# [Reporting]
# # Standard-Berichtssprache
# language = de
#
# # Berichtsdatum-Format
# report_date_format = %d.%m.%Y
#
# # Zeitformat für Berichte
# report_time_format = %H:%M
#
# # Logo-Pfad für Berichte (optional)
# # logo_path = assets/logo.png

# [Notifications]
# # E-Mail-Benachrichtigungen aktivieren
# email_notifications = false
#
# # Standard-Absender-E-Mail
# from_email = noreply@project.local
#
# # SMTP-Server (falls E-Mail aktiviert)
# # smtp_server = smtp.gmail.com
# # smtp_port = 587

# [Database]
# # Datenbanktyp (sqlite, postgresql, mysql)
# db_type = sqlite
#
# # Datenbankpfad/-name
# db_path = data/project.db
#
# # Verbindungs-Timeout (in Sekunden)
# db_timeout = 30

# [Backup]
# # Automatische Backups erstellen
# auto_backup = true
#
# # Backup-Verzeichnis
# backup_dir = backups
#
# # Anzahl der aufzubewahrenden Backups
# backup_retention = 5
#
# # Backup-Format (zip, tar.gz)
# backup_format = zip

# [Logging]
# # Log-Level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
# log_level = INFO
#
# # Log-Verzeichnis
# log_dir = log
#
# # Log-Datei-Format
# log_file_format = sproject_%Y%m%d_%H%M%S.log
#
# # Maximale Log-Dateigröße (in MB)
# max_log_size = 10
#
# # Anzahl der aufzubewahrenden Log-Dateien
# log_retention = 10

# [Advanced]
# # Parallelverarbeitung aktivieren
# parallel_processing = false
#
# # Anzahl der Worker-Threads
# worker_threads = 4
#
# # Cache aktivieren
# enable_cache = true
#
# # Cache-Verzeichnis
# cache_dir = .cache
#
# # Cache-Ablaufzeit (in Stunden)
# cache_ttl = 24
#
# # Debug-Modus
# debug_mode = false

# ============================================================================
# Ende der Konfiguration
# ============================================================================
