# ============================================================================
# txt_export.cfg
# ============================================================================
# Konfiguration für TXT-Export (ASCII-Textformat)
# ============================================================================

[sections]
# Reihenfolge der Sektionen im TXT-Report (kommagetrennt)
# Verfügbare Sektionen: summary, critical_path, netplan, tasklist, resource_list, cost_overview
section_order = summary, critical_path, netplan, tasklist, resource_list, cost_overview

[de]
# Deutsche Überschriften für die Sektionen
summary       = PROJEKTZUSAMMENFASSUNG
critical_path = KRITISCHER PFAD
netplan       = NETZPLAN TABELLE
tasklist      = ALLE TASKS
resource_list = VERANTWORTLICHE
cost_overview = KOSTENÜBERSICHT

# Spaltentitel (nur TXT-spezifisch; gemeinsame Titel stehen in defaults.cfg [de])
nachfolger    = Nachfolger

[en]
# English section headings (auto-uppercased in TXT output)
summary       = PROJECT SUMMARY
critical_path = CRITICAL PATH
netplan       = NETWORK PLAN TABLE
tasklist      = ALL TASKS
resource_list = RESOURCES
cost_overview = COST OVERVIEW

# TXT-specific column label
nachfolger    = Successors


# ============================================================================
# Ende der Konfiguration
# ============================================================================
