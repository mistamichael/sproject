# ============================================================================
# txt_export.cfg
# ============================================================================
# Konfiguration für TXT-Export (ASCII-Textformat)
# ============================================================================

[sections]
# Reihenfolge der Sektionen im TXT-Report (kommagetrennt)
# Verfügbare Sektionen: summary, critical_path, netplan_ascii, tasklist, resource_list
section_order = summary, critical_path, netplan_ascii, netplan_table, tasklist, resource_list

[de]
# Deutsche Überschriften für die Sektionen
summary       = PROJEKTZUSAMMENFASSUNG
critical_path = KRITISCHER PFAD
netplan_ascii = NETZPLAN ASCII
netplan_table = NETZPLAN TABELLE
tasklist      = ALLE TASKS
resource_list = VERANTWORTLICHE

[netplan_content]
# Inhalt der Netzplan-Knoten (identisch mit markdown_export.cfg)
# Verfügbare Felder: id, name, duration, faz, fez, saz, sez, gp, fp
row_1 = id, name
row_2 = gp, fp


# ============================================================================
# Ende der Konfiguration
# ============================================================================
