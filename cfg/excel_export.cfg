# ============================================================================
# excel_export.cfg
# ============================================================================
# Konfiguration für Excel-Export (Gantt-Chart, Resource List)
# ============================================================================

[Gantt_resolution]
# Zeitauflösung basierend auf minimaler Task-Dauer
# Die Auflösung wird automatisch basierend auf der kürzesten Task-Dauer gewählt:
#
# Wenn minimale Task-Dauer < threshold_hours_min:
#   => Stundenauflösung (work_start_hour - work_end_hour)
# Wenn minimale Task-Dauer < threshold_halfday_min:
#   => Halbtagesauflösung (Vormittag/Nachmittag)
# Sonst:
#   => Tagesauflösung (volle Tage)

# Schwellenwert für Stundenauflösung (in Minuten)
# Wenn die kürzeste Task < 60 Minuten ist, zeige Stunden
threshold_hours_min = 60

# Schwellenwert für Halbtagesauflösung (in Minuten)
# Wenn die kürzeste Task < 240 Minuten (4 Stunden) ist, zeige halbe Tage
threshold_halfday_min = 240

# Arbeitszeit-Bereich für Stundenauflösung
work_start_hour = 7
work_end_hour = 20

# Standard-Arbeitstage (kommasepariert: mon,tue,wed,thu,fri,sat,sun)
# Diese werden verwendet wenn keine projekt-spezifischen working_days definiert sind
# Bei Schichtarbeit können hier auch Wochenenden enthalten sein (z.B. fri,sat,sun)
working_days = mon,tue,wed,thu,fri

[GanttChart]
# Farbverlauf für Gantt-Balken
# Startfarbe (Hex-Format ohne #)
color_start = 8B7AB8

# Zielfarbe (Hex-Format ohne #)
color_end = 4472C4

# Farbe für kritische Pfad-Umrandung (Hex-Format ohne #)
critical_border_color = FF0000

# Transparenz für "freien" Puffer-Balken (0-255, 0 = transparent, 255 = opak)
slack_bar_transparency = 180

# Balkendiagramm-Höhe (in Excel-Zeilen-Höhe)
bar_height = 20

# Zeitstrahl-Kopfzeilen-Höhe (in Excel-Zeilen-Höhe)
timeline_header_height = 25

# Spaltenbreiten (in Excel-Einheiten)
col_width_id = 12
col_width_name = 20
col_width_start = 12
col_width_end = 12
col_width_effort = 10

[ResourceList]
# Spaltenbreiten für Resource List
col_width_resource = 20
col_width_task = 25
col_width_start = 12
col_width_end = 12
col_width_duration = 10

# Farben für unterschiedliche Ressourcentypen
# (Hex-Format ohne #)
color_person = 8B7AB8
color_machine = FFA500
color_material = 90EE90

# Wochenend-Hintergrundfarbe
weekend_background_color = F0F0F0


[Gantt_timeline]
# Zeitdarstellung im Excel-Gantt-Chart pro Granularitätsstufe
#
# Minutengranularität: Minuten pro Spalte (Standard: 1 = jede Minute eine Spalte)
minutes_per_col = 1
#
# Stundengranularität: Minuten pro Spalte (Standard: 30 = halbe Stunde)
hours_col_minutes = 30
#
# Schichtstart (aus defaults.cfg gelesen, hier überschreibbar)
# Format: HH:MM - bestimmt die Beschriftung der ersten Spalte eines Arbeitstages
# morning_shift_start = 09:00

[sections]
# Reihenfolge der Reiter
# Verfügbare Sektionen: summary, critical_path, tasklist, gantt_chart, resource_list, cost_overview
section_order = summary, critical_path, tasklist, gantt_chart, resource_list, cost_overview

[de]
# Deutsche Tab-Namen (Reiter-Beschriftungen im Excel)
summary       = Projektzusammenfassung
critical_path = Kritischer Pfad
tasklist      = Alle Tasks
resource_list = Verantwortliche
cost_overview = Kosten



# ============================================================================
# Ende der Konfiguration
# ============================================================================
