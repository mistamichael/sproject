# ============================================================================
# json_export.cfg
# ============================================================================
# Konfiguration für JSON-Export (CPM-Netzplan)
# ============================================================================

[sections]
# Schlüssel, die in der JSON-Ausgabe enthalten sein sollen (kommagetrennt)
# Verfügbare Sektionen:
#   summary        - Projektmetadaten (Name, Dauer, Zeiteinheit, Start, Ende)
#   critical_path  - Liste der Task-IDs auf dem kritischen Pfad
#   tasks          - Alle Tasks mit CPM-Werten (FAZ, FEZ, SAZ, SEZ, GP, FP)
#   gantt_chart    - Kalender-basierter Gantt-Plan (Phase 2, falls vorhanden)
#   resource_list  - Ressourcen-Zuordnung (nur PersonProject)
#   cost_overview  - Kostenrechnung (Personen- und Ressourcen-Stundensätze)
#   settings       - Berechnungseinstellungen (skip_weekends, skip_holidays, ...)
section_order = summary, critical_path, tasks, gantt_chart, resource_list, cost_overview, settings

[de]
# JSON verwendet interne Schlüssel (keine Lokalisierung der Keys).
# Platzhalter für Konsistenz mit anderen Export-Formaten.

[en]
# JSON uses internal keys (no localization of keys).
# Placeholder for consistency with other export formats.

# ============================================================================
# Ende der Konfiguration
# ============================================================================
