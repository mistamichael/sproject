# ============================================================================
# json_export.cfg
# ============================================================================
# Konfiguration für JSON-Export (CPM-Netzplan)
# ============================================================================

[sections]
# Schlüssel, die in der JSON-Ausgabe enthalten sein sollen (kommagetrennt)
# Verfügbare Sektionen:
#   summary        - Projektmetadaten (Name, Dauer, Zeiteinheit, Start, Ende)
#   critical_path  - Liste der Task-IDs auf dem kritischen Pfad
#   tasks          - Alle Tasks mit CPM-Werten (FAZ, FEZ, SAZ, SEZ, GP, FP)
#   gantt_schedule - Kalender-basierter Gantt-Plan (Phase 2, falls vorhanden)
#   resources      - Ressourcen-Zuordnung (nur PersonProject)
#   settings       - Berechnungseinstellungen (skip_weekends, skip_holidays, ...)
section_order = summary, critical_path, tasks, gantt_schedule, resources, settings


# ============================================================================
# Ende der Konfiguration
# ============================================================================
