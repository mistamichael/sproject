# ============================================================================
# markdown_export.cfg
# ============================================================================
# Konfiguration für Markdown-Export (Sektionsreihenfolge, Überschriften)
# ============================================================================

[sections]
# Reihenfolge der Sektionen im Markdown-Report (kommagetrennt)
# Verfügbare Sektionen: summary, critical_path, netplan, tasklist, gantt_chart, resource_list
section_order = summary, critical_path, netplan, tasklist, gantt_chart, resource_list

[de]
# Deutsche Überschriften für die Sektionen
summary      = Projektzusammenfassung
critical_path = Kritischer Pfad
netplan      = Netzplan
tasklist     = Alle Tasks
gantt_chart  = Gantt Chart (mit Wochenenden)
resource_list = Resource List

[MermaidNetplan]
# Darstellung des Mermaid-Netzplans
# Kritischen Pfad farblich hervorheben
show_critical_path = true

# Puffer-Informationen in Knoten anzeigen (veraltet, wird durch [netplan_content] gesteuert)
show_slack = false

# Farben (Hex ohne #)
critical_color  = ff6b6b
critical_border = c92a2a
normal_color    = 4472c4
normal_border   = 2f5496

[netplan_content]
# Inhalt der Netzplan-Knoten: Konfigurierbare Zeilen im Knoten-Label
# Jede row_N definiert eine Zeile (kommagetrennte Felder)
#
# Verfügbare Felder:
#   id        - Task-ID          (z.B. [1])
#   name      - Task-Name
#   duration  - Dauer            (Kürzel: d)
#   faz       - Frühester Anfangszeitpunkt
#   fez       - Frühester Endzeitpunkt
#   saz       - Spätester Anfangszeitpunkt
#   sez       - Spätester Endzeitpunkt
#   gp        - Gesamtpuffer
#   fp        - Freier Puffer
#
# Klassisches Netzplan-Layout (4 Zeilen):
# row_1 = faz, duration, fez
# row_2 = id, name
# row_3 = saz, gp, sez
# row_4 = fp
row_1 = id, name
row_2 = gp, fp


# ============================================================================
# Ende der Konfiguration
# ============================================================================
